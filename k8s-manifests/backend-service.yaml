apiVersion: v1
kind: Service
metadata:
  name: shopnest-backend-service
spec:
  type: LoadBalancer # Exposes external IP address for traffic
  selector:
    app: shopnest-backend # Connects to Pods matching label "shopnest-backend"
  ports:
    - protocol: TCP
      port: 80         # Incoming external port
      targetPort: 5000 # Internal container port